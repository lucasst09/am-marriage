services:
  ammarriage-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: ammarriage-prod
    restart: unless-stopped
    ports:
      - "80:80"      # Nginx (frontend + proxy para API)
    environment:
      - NODE_ENV=production
    volumes:
      - ./data:/app/data  # Persistir dados de confirmações
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/confirmations/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
